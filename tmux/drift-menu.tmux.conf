# drift-menu.tmux.conf — keybind to open the drift control menu in a popup.
# Sourced from ~/.tmux.conf via:
#   source-file ~/.claude/tmux/drift-menu.tmux.conf
# prefix + D  → floating popup above the pane running the Textual drift menu.
bind-key D display-popup -w 80% -h 60% -E "~/.claude/scripts/drift-menu-launch.sh"
