name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bash:
    name: bash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu exercises GNU coreutils, macos the BSD ones and /bin/bash 3.2 that largo runs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Every JSON file parses
        run: find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -n1 jq empty
      - name: Tests
        run: for t in tests/*.sh; do echo "::group::$t"; bash "$t"; echo "::endgroup::"; done
      - name: Tests under /bin/bash (3.2 on macOS)
        if: runner.os == 'macOS'
        run: for t in tests/*.sh; do /bin/bash "$t"; done

  plugin:
    name: plugin (claude-code 2.1.322)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Mod tests (claude plugin test)
        run: pnpm dlx @anthropic-ai/claude-code@2.1.322 plugin test .
      - name: Plugin validates (only the reserved-name errors are known)
        # claude-statusline is a reserved-looking name, so validate exits 1 by design; any other error, or a
        # blocking directory finding, fails. Warnings (no icon) are pre-existing and allowed. pnpm progress lines
        # may precede the JSON, so it is cut from the first line that starts with "{".
        run: |
          pnpm dlx @anthropic-ai/claude-code@2.1.322 plugin validate . --json > validate.raw || true
          sed -n '/^{/,$p' validate.raw > validate.json
          jq -e '[.. | objects | select(has("errors")) | .errors[]] | all(.message | test("is reserved"))' validate.json
          jq -e '[.directory.findings[]? | select(.blocking)] | length == 0' validate.json

  pwsh:
    name: pwsh (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Every PowerShell script parses
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          exit [int]($bad -gt 0)
      - name: Tests
        run: |
          foreach ($t in Get-ChildItem tests -Filter *.ps1) { pwsh -NoProfile -File $t.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
